<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JavaScript 계산기</title>
  <link rel="stylesheet" href="calculator_style.css">
  <script src="calculator.js" defer></script>
</head>
<body>
  <main class="calculator">
    <h1>계산기</h1>
    <p class="description">QuerySelector와 EventListener로 만든 계산기</p>

    <section class="display" aria-label="계산기 화면">
      <div id="previous-operand" class="previous-operand" aria-live="polite"></div>
      <output id="current-operand" class="current-operand" aria-live="polite">0</output>
    </section>

    <section class="keys" aria-label="계산기 버튼">
      <button type="button" class="key function" data-action="clear">AC</button>
      <button type="button" class="key function" data-action="delete">DEL</button>
      <button type="button" class="key operator" data-operator="÷">÷</button>
      <button type="button" class="key operator" data-operator="×">×</button>

      <button type="button" class="key" data-number="7">7</button>
      <button type="button" class="key" data-number="8">8</button>
      <button type="button" class="key" data-number="9">9</button>
      <button type="button" class="key operator" data-operator="-">−</button>

      <button type="button" class="key" data-number="4">4</button>
      <button type="button" class="key" data-number="5">5</button>
      <button type="button" class="key" data-number="6">6</button>
      <button type="button" class="key operator" data-operator="+">+</button>

      <button type="button" class="key" data-number="1">1</button>
      <button type="button" class="key" data-number="2">2</button>
      <button type="button" class="key" data-number="3">3</button>
      <button type="button" class="key equals" data-action="equals">=</button>

      <button type="button" class="key zero" data-number="0">0</button>
      <button type="button" class="key" data-action="decimal">.</button>
    </section>
    <p id="message" class="message" role="status"></p>
  </main>
</body>
</html>
